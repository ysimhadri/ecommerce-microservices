# Scaffold only — this repo does not yet run a Spring Cloud Gateway process
# (API Gateway remains deferred). Drop this into a gateway application's
# application.yml when that service is built.
#
# Route: /eligibility/** → eligibility-api (Eureka lb://eligibility-api)
# Authorization passes through unchanged; X-Request-Id needs the filter below.

spring:
  cloud:
    gateway:
      # Authorization and Cookie are NOT stripped by Spring Cloud Gateway by
      # default, so they reach the service as-is. X-Request-Id is generated
      # by the custom filter below when the caller did not send one.
      routes:
        - id: eligibility-api
          uri: lb://eligibility-api
          predicates:
            - Path=/eligibility/**
          filters:
            # Gateway path /eligibility/** -> service path /api/eligibility/**
            - RewritePath=/eligibility/(?<segment>.*), /api/eligibility/$\{segment}
            - PreserveHostHeader
            - name: Retry
              args:
                retries: 1
                methods: GET
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE

