# Establishes the convention every future service in services/ will join:
# its own container, on this shared network, with its own datastore.
services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-authdb}
      POSTGRES_USER: ${DB_USERNAME:-authuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-authpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-authuser} -d ${DB_NAME:-authdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  auth-service:
    build:
      context: ./services/auth-service
    container_name: auth-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-authdb}
      DB_USERNAME: ${DB_USERNAME:-authuser}
      DB_PASSWORD: ${DB_PASSWORD:-authpass}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-auth-service-hs256-signing-secret-32bytes+}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No actuator dependency in this service, so just confirm the HTTP
      # port is accepting and answering requests (any response - even a
      # 405 for GET on a POST-only route - proves Spring Boot is up;
      # wget's exit code 4 means "could not connect" and is the only
      # failure case here).
      test: ["CMD-SHELL", "wget -qO- -T 3 http://localhost:8080/api/v1/auth/login >/dev/null 2>&1; test $? -ne 4"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-net

  catalog-postgres:
    image: postgres:16-alpine
    container_name: catalog-postgres
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalogdb}
      POSTGRES_USER: ${CATALOG_DB_USERNAME:-cataloguser}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalogpass}
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USERNAME:-cataloguser} -d ${CATALOG_DB_NAME:-catalogdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  product-catalog-service:
    build:
      context: ./services/product-catalog-service
    container_name: product-catalog-service
    environment:
      DB_HOST: catalog-postgres
      DB_PORT: 5432
      DB_NAME: ${CATALOG_DB_NAME:-catalogdb}
      DB_USERNAME: ${CATALOG_DB_USERNAME:-cataloguser}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalogpass}
      # Must match api-portal-service's PORTAL_JWT_SECRET below - this
      # service only validates S2S tokens locally (see PortalJwtValidator),
      # it never calls api-portal-service over the network to do so, so
      # there is no depends_on between them.
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-dev-only-change-me-api-portal-service-hs256-signing-secret-32bytes+}
      PORTAL_JWT_AUDIENCE: ${PORTAL_JWT_AUDIENCE:-product-catalog-service}
    ports:
      - "8081:8080"
    depends_on:
      catalog-postgres:
        condition: service_healthy
    healthcheck:
      # No actuator dependency in this service, so just confirm the HTTP
      # port is accepting and answering requests (any response proves
      # Spring Boot is up; wget's exit code 4 means "could not connect" and
      # is the only failure case here).
      test: ["CMD-SHELL", "wget -qO- -T 3 http://localhost:8080/api/v1/catalog/categories >/dev/null 2>&1; test $? -ne 4"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-net

  portal-postgres:
    image: postgres:16-alpine
    container_name: portal-postgres
    environment:
      POSTGRES_DB: ${PORTAL_DB_NAME:-portaldb}
      POSTGRES_USER: ${PORTAL_DB_USERNAME:-portaluser}
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:-portalpass}
    volumes:
      - portal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PORTAL_DB_USERNAME:-portaluser} -d ${PORTAL_DB_NAME:-portaldb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  api-portal-service:
    build:
      context: ./services/api-portal-service
    container_name: api-portal-service
    environment:
      DB_HOST: portal-postgres
      DB_PORT: 5432
      DB_NAME: ${PORTAL_DB_NAME:-portaldb}
      DB_USERNAME: ${PORTAL_DB_USERNAME:-portaluser}
      DB_PASSWORD: ${PORTAL_DB_PASSWORD:-portalpass}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-dev-only-change-me-api-portal-service-hs256-signing-secret-32bytes+}
    ports:
      - "8082:8080"
    depends_on:
      portal-postgres:
        condition: service_healthy
    healthcheck:
      # No actuator dependency in this service, so just confirm the HTTP
      # port is accepting and answering requests (any response proves
      # Spring Boot is up; wget's exit code 4 means "could not connect" and
      # is the only failure case here).
      test: ["CMD-SHELL", "wget -qO- -T 3 http://localhost:8080/api/v1/portal/services >/dev/null 2>&1; test $? -ne 4"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-net

  cart-postgres:
    image: postgres:16-alpine
    container_name: cart-postgres
    environment:
      POSTGRES_DB: ${CART_DB_NAME:-cartdb}
      POSTGRES_USER: ${CART_DB_USERNAME:-cartuser}
      POSTGRES_PASSWORD: ${CART_DB_PASSWORD:-cartpass}
    volumes:
      - cart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CART_DB_USERNAME:-cartuser} -d ${CART_DB_NAME:-cartdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  cart-service:
    build:
      context: ./services/cart-service
    container_name: cart-service
    environment:
      DB_HOST: cart-postgres
      DB_PORT: 5432
      DB_NAME: ${CART_DB_NAME:-cartdb}
      DB_USERNAME: ${CART_DB_USERNAME:-cartuser}
      DB_PASSWORD: ${CART_DB_PASSWORD:-cartpass}
      # Must match auth-service's JWT_SECRET. This service only verifies user tokens locally.
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-auth-service-hs256-signing-secret-32bytes+}
    ports:
      - "8083:8080"
    depends_on:
      cart-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 http://localhost:8080/api/v1/carts/00000000-0000-0000-0000-000000000000 >/dev/null 2>&1; test $? -ne 4"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-net

  inventory-postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventorydb}
      POSTGRES_USER: ${INVENTORY_DB_USERNAME:-inventoryuser}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventorypass}
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USERNAME:-inventoryuser} -d ${INVENTORY_DB_NAME:-inventorydb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  inventory-service:
    build:
      context: ./services/inventory-service
    container_name: inventory-service
    environment:
      DB_HOST: inventory-postgres
      DB_PORT: 5432
      DB_NAME: ${INVENTORY_DB_NAME:-inventorydb}
      DB_USERNAME: ${INVENTORY_DB_USERNAME:-inventoryuser}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventorypass}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-auth-service-hs256-signing-secret-32bytes+}
    ports:
      - "8084:8080"
    depends_on:
      inventory-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 http://localhost:8080/api/v1/inventory/stock/00000000-0000-0000-0000-000000000000 >/dev/null 2>&1; test $? -ne 4"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-net

  payment-postgres:
    image: postgres:16-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-paymentdb}
      POSTGRES_USER: ${PAYMENT_DB_USERNAME:-paymentuser}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-paymentpass}
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USERNAME:-paymentuser} -d ${PAYMENT_DB_NAME:-paymentdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  payment-service:
    build:
      context: ./services/payment-service
    container_name: payment-service
    environment:
      DB_HOST: payment-postgres
      DB_PORT: 5432
      DB_NAME: ${PAYMENT_DB_NAME:-paymentdb}
      DB_USERNAME: ${PAYMENT_DB_USERNAME:-paymentuser}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-paymentpass}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-auth-service-hs256-signing-secret-32bytes+}
    ports:
      - "8087:8080"
    depends_on:
      payment-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 http://localhost:8080/api/v1/payments/authorizations >/dev/null 2>&1; test $? -ne 4"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-net

  order-postgres:
    image: postgres:16-alpine
    container_name: order-postgres
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-orderdb}
      POSTGRES_USER: ${ORDER_DB_USERNAME:-orderuser}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-orderpass}
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USERNAME:-orderuser} -d ${ORDER_DB_NAME:-orderdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  order-service:
    build:
      context: ./services/order-service
    container_name: order-service
    environment:
      DB_HOST: order-postgres
      DB_PORT: 5432
      DB_NAME: ${ORDER_DB_NAME:-orderdb}
      DB_USERNAME: ${ORDER_DB_USERNAME:-orderuser}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-orderpass}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-auth-service-hs256-signing-secret-32bytes+}
      CART_SERVICE_URL: http://cart-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      CATALOG_SERVICE_URL: http://product-catalog-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
    ports:
      - "8085:8080"
    depends_on:
      order-postgres:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      product-catalog-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 http://localhost:8080/api/v1/orders/00000000-0000-0000-0000-000000000000 >/dev/null 2>&1; test $? -ne 4"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-net

  eligibility-redis:
    image: redis:7-alpine
    container_name: eligibility-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce-net

  # Lightweight registry so eligibility-api can register and resolve
  # customer-profile-service by name. Not a production Eureka cluster.
  eligibility-eureka:
    image: steeltoeoss/eureka-server:4.1.1
    container_name: eligibility-eureka
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    networks:
      - ecommerce-net

  eligibility-api:
    build:
      context: ./services/eligibility-api
    container_name: eligibility-api
    environment:
      REDIS_HOST: eligibility-redis
      REDIS_PORT: 6379
      EUREKA_URI: http://eligibility-eureka:8761/eureka
      EUREKA_ENABLED: "true"
      CUSTOMER_PROFILE_STUB: "true"
      CREDIT_BUREAU_MODE: mock
      ELIGIBILITY_DB_PATH: /app/data/eligibility
    ports:
      - "8086:8080"
    depends_on:
      eligibility-redis:
        condition: service_healthy
      eligibility-eureka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 http://localhost:8080/actuator/health >/dev/null 2>&1; test $? -ne 4"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - ecommerce-net

volumes:
  postgres_data:
  catalog_postgres_data:
  portal_postgres_data:
  cart_postgres_data:
  inventory_postgres_data:
  order_postgres_data:
  payment_postgres_data:

networks:
  ecommerce-net:
    driver: bridge
