server:
  port: 8080

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentdb}
    username: ${DB_USERNAME:paymentuser}
    password: ${DB_PASSWORD:paymentpass}
  jpa:
    open-in-view: false
    hibernate:
      # Schema comes solely from Flyway migrations; JPA only validates the
      # entity mapping against it at startup - it never generates DDL.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Same HS256 secret auth-service signs with. This service only verifies
    # the caller. It never issues tokens and never calls auth-service.
    secret: ${JWT_SECRET:dev-only-change-me-auth-service-hs256-signing-secret-32bytes+}

logging:
  level:
    com.ecommerce.payment: INFO
