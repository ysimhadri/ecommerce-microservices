server:
  port: 8080

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderdb}
    username: ${DB_USERNAME:orderuser}
    password: ${DB_PASSWORD:orderpass}
  jpa:
    open-in-view: false
    hibernate:
      # Schema comes solely from Flyway migrations; JPA only validates the
      # entity mapping against it at startup - it never generates DDL.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Same HS256 secret auth-service signs with. This service only verifies
    # the caller and forwards that bearer token to cart, inventory, and payment.
    secret: ${JWT_SECRET:dev-only-change-me-auth-service-hs256-signing-secret-32bytes+}
  clients:
    cart-base-url: ${CART_SERVICE_URL:http://localhost:8083}
    inventory-base-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
    catalog-base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    payment-base-url: ${PAYMENT_SERVICE_URL:http://localhost:8087}

# Breaker on the outbound payment client only. Declines are ignored so they
# cannot open the circuit. Outages are recorded. An open circuit fails the
# call immediately as PAYMENT_UNAVAILABLE.
resilience4j:
  circuitbreaker:
    instances:
      payment:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.ecommerce.order.exception.OrderExceptions$PaymentUnavailableException
          - org.springframework.web.client.RestClientException
        ignoreExceptions:
          - com.ecommerce.order.exception.OrderExceptions$PaymentDeclinedException

logging:
  level:
    com.ecommerce.order: INFO
