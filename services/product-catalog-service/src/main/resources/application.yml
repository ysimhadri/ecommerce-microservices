server:
  port: 8080

spring:
  application:
    name: product-catalog-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalogdb}
    username: ${DB_USERNAME:cataloguser}
    password: ${DB_PASSWORD:catalogpass}
  jpa:
    open-in-view: false
    hibernate:
      # Schema comes solely from Flyway migrations; JPA only validates the
      # entity mapping against it at startup - it never generates DDL.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    cache-names: categories, products
    caffeine:
      # Bounded, in-process, read-optimized cache for the query side (see
      # CacheConfig) - no extra infrastructure to run for a v1 service.
      spec: maximumSize=500,expireAfterWrite=5m

app:
  portal:
    jwt:
      # Must be the exact same value as api-portal-service's PORTAL_JWT_SECRET -
      # this service only *validates* S2S tokens (see PortalJwtValidator), it
      # never talks to api-portal-service over the network to do so. The
      # default below matches api-portal-service's dev-only default so
      # `docker compose up` works out of the box; override both together.
      secret: ${PORTAL_JWT_SECRET:dev-only-change-me-api-portal-service-hs256-signing-secret-32bytes+}
      # This service's own registered name in api-portal-service - the
      # audience a token must carry to be accepted here. Must match the
      # `name` this service was registered under via POST /api/v1/portal/services.
      audience: ${PORTAL_JWT_AUDIENCE:product-catalog-service}

logging:
  level:
    com.ecommerce.catalog: INFO
