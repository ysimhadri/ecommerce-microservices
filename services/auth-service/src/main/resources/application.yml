server:
  port: 8080

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}
    username: ${DB_USERNAME:authuser}
    password: ${DB_PASSWORD:authpass}
  jpa:
    open-in-view: false
    hibernate:
      # Schema comes solely from Flyway migrations; JPA only validates the
      # entity mapping against it at startup - it never generates DDL.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Overridable via env var in every environment; this default is dev-only
    # and long enough (>= 32 bytes) to satisfy HS256's minimum key length.
    secret: ${JWT_SECRET:dev-only-change-me-auth-service-hs256-signing-secret-32bytes+}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes - short-lived access token only

logging:
  level:
    com.ecommerce.auth: INFO
