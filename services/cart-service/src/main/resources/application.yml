server:
  port: 8080

spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cartdb}
    username: ${DB_USERNAME:cartuser}
    password: ${DB_PASSWORD:cartpass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Must equal auth-service's JWT_SECRET: tokens are validated locally.
    secret: ${JWT_SECRET:dev-only-change-me-auth-service-hs256-signing-secret-32bytes+}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}

logging:
  level:
    com.ecommerce.cart: INFO
