server:
  port: 8080

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventorydb}
    username: ${DB_USERNAME:inventoryuser}
    password: ${DB_PASSWORD:inventorypass}
  jpa:
    open-in-view: false
    hibernate:
      # Schema comes solely from Flyway migrations; JPA only validates the
      # entity mapping against it at startup - it never generates DDL.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Same HS256 secret auth-service signs with. Reservation commands verify
    # the forwarded user token locally. Stock upsert stays open (see SecurityConfig).
    secret: ${JWT_SECRET:dev-only-change-me-auth-service-hs256-signing-secret-32bytes+}

logging:
  level:
    com.ecommerce.inventory: INFO
